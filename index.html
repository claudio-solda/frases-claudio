<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Frases</title>
<meta name="theme-color" content="#241a12">
<link rel="icon" href="icon-512.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Caveat:wght@600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#e7ddc6;
    --paper-dark:#dcd0b2;
    --ink:#2b2118;
    --ink-soft:#5b5140;
    --line:rgba(43,33,24,.15);

    --tag-motivacional:#b5652f;
    --tag-signos:#3d4a7a;
    --tag-fe:#3e6b5c;
    --tag-futebol:#1e7a44;
    --tag-outro:#7a5230;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    background-image:
      radial-gradient(ellipse at top left, rgba(255,255,255,.25), transparent 60%),
      repeating-linear-gradient(0deg, rgba(0,0,0,.015) 0px, rgba(0,0,0,.015) 1px, transparent 1px, transparent 3px);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    min-height:100vh;
    padding-bottom:100px;
    -webkit-tap-highlight-color:transparent;
  }

  header{
    padding:28px 20px 16px;
    position:relative;
  }
  header h1{
    font-family:'Fraunces',serif;
    font-weight:700;
    font-size:2.5rem;
    line-height:1;
    margin:0;
    letter-spacing:-.01em;
  }
  header .sub{
    font-family:'Caveat',cursive;
    font-size:1.3rem;
    color:var(--ink-soft);
    margin-top:2px;
    transform:rotate(-1deg);
    display:inline-block;
  }
  .pinhead{
    position:absolute;
    top:22px; right:20px;
    width:14px;height:14px;
    border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #e8938a, #a8322a 70%);
    box-shadow:0 2px 3px rgba(0,0,0,.35);
  }

  /* filtros */
  .filters{
    display:flex;
    gap:8px;
    padding:4px 20px 18px;
    overflow-x:auto;
    scrollbar-width:none;
  }
  .filters::-webkit-scrollbar{display:none;}
  .chip{
    flex:0 0 auto;
    font-family:'IBM Plex Mono',monospace;
    font-size:.72rem;
    letter-spacing:.03em;
    text-transform:uppercase;
    padding:7px 13px;
    border-radius:20px;
    border:1.5px solid var(--ink);
    background:transparent;
    color:var(--ink);
    cursor:pointer;
    white-space:nowrap;
  }
  .chip.active{
    background:var(--ink);
    color:var(--paper);
  }

  /* lista */
  #lista{
    padding:0 20px;
    display:flex;
    flex-direction:column;
    gap:22px;
  }

  .card{
    position:relative;
    background:#f4eeda;
    padding:22px 20px 18px;
    box-shadow:0 3px 8px rgba(43,33,24,.18), 0 1px 0 rgba(255,255,255,.4) inset;
    transform:rotate(var(--tilt,0deg));
    border-radius:2px;
  }
  .card::before{
    /* torn top edge */
    content:"";
    position:absolute;
    top:-6px; left:0; right:0;
    height:10px;
    background:
      linear-gradient(135deg, transparent 45%, #f4eeda 45%) 0 0/10px 10px,
      linear-gradient(-135deg, transparent 45%, #f4eeda 45%) 5px 0/10px 10px;
    background-repeat:repeat-x;
  }
  .pin{
    position:absolute;
    top:8px; left:18px;
    width:11px;height:11px;
    border-radius:50%;
    box-shadow:0 2px 2px rgba(0,0,0,.35);
  }
  .tag{
    display:inline-block;
    font-family:'IBM Plex Mono',monospace;
    font-size:.68rem;
    letter-spacing:.04em;
    text-transform:uppercase;
    padding:3px 9px 2px;
    border-radius:10px;
    color:#fff;
    margin-left:16px;
    margin-bottom:10px;
  }
  .frase{
    font-family:'Fraunces',serif;
    font-weight:500;
    font-size:1.18rem;
    line-height:1.4;
    margin:0 0 10px;
  }
  .meta{
    display:flex;
    justify-content:space-between;
    align-items:center;
    font-family:'IBM Plex Mono',monospace;
    font-size:.72rem;
    color:var(--ink-soft);
  }
  .del{
    background:none;
    border:none;
    color:var(--ink-soft);
    font-family:'IBM Plex Mono',monospace;
    font-size:.72rem;
    text-decoration:underline;
    cursor:pointer;
    padding:4px;
  }

  .empty{
    text-align:center;
    padding:60px 20px;
    color:var(--ink-soft);
  }
  .empty .big{
    font-family:'Caveat',cursive;
    font-size:1.6rem;
    display:block;
    margin-bottom:6px;
  }

  /* botão flutuante */
  .fab{
    position:fixed;
    bottom:24px; right:22px;
    width:58px; height:58px;
    border-radius:50%;
    background:var(--ink);
    color:var(--paper);
    font-size:1.8rem;
    line-height:58px;
    text-align:center;
    border:none;
    box-shadow:0 4px 12px rgba(0,0,0,.35);
    cursor:pointer;
    z-index:20;
  }

  /* modal */
  .overlay{
    position:fixed; inset:0;
    background:rgba(20,15,10,.55);
    display:none;
    align-items:flex-end;
    z-index:30;
  }
  .overlay.show{display:flex;}
  .sheet{
    width:100%;
    background:var(--paper);
    border-radius:18px 18px 0 0;
    padding:22px 20px 28px;
    box-shadow:0 -6px 24px rgba(0,0,0,.3);
    animation:up .18s ease-out;
  }
  @keyframes up{from{transform:translateY(30px);opacity:0;}to{transform:translateY(0);opacity:1;}}
  .sheet h2{
    font-family:'Fraunces',serif;
    margin:0 0 14px;
    font-size:1.4rem;
  }
  label{
    display:block;
    font-family:'IBM Plex Mono',monospace;
    font-size:.7rem;
    text-transform:uppercase;
    letter-spacing:.03em;
    color:var(--ink-soft);
    margin-bottom:6px;
    margin-top:14px;
  }
  textarea, select, input[type=text]{
    width:100%;
    font-family:'Inter',sans-serif;
    font-size:1rem;
    padding:10px 12px;
    border:1.5px solid var(--line);
    border-radius:8px;
    background:#fbf7ec;
    color:var(--ink);
    resize:vertical;
  }
  textarea{min-height:80px;}
  .catrow{display:flex; gap:8px; flex-wrap:wrap; margin-top:4px;}
  .catbtn{
    font-family:'IBM Plex Mono',monospace;
    font-size:.72rem;
    text-transform:uppercase;
    padding:7px 12px;
    border-radius:14px;
    border:1.5px solid var(--ink);
    background:transparent;
    cursor:pointer;
  }
  .catbtn.active{background:var(--ink); color:var(--paper);}
  .actions{
    display:flex;
    gap:10px;
    margin-top:20px;
  }
  .btn{
    flex:1;
    padding:13px;
    border-radius:10px;
    border:none;
    font-family:'Inter',sans-serif;
    font-weight:600;
    font-size:.95rem;
    cursor:pointer;
  }
  .btn.primary{background:var(--ink); color:var(--paper);}
  .btn.ghost{background:transparent; color:var(--ink); border:1.5px solid var(--ink);}
</style>
</head>
<body>

<header>
  <div class="pinhead"></div>
  <h1>Frases</h1>
  <span class="sub">seu mural de recortes</span>
</header>

<div class="filters" id="filters"></div>

<div id="lista"></div>

<button class="fab" onclick="abrirModal()">+</button>

<div class="overlay" id="overlay">
  <div class="sheet">
    <h2>Nova frase</h2>
    <label>Frase</label>
    <textarea id="inputFrase" placeholder="Cole ou digite a frase..."></textarea>
    <button type="button" class="btn ghost" style="margin-top:8px; flex:none; padding:9px 14px; font-size:.85rem;" onclick="colarDaAreaTransferencia()">📋 Colar da área de transferência</button>

    <label>Categoria</label>
    <div class="catrow" id="catrow"></div>
    <input type="text" id="inputCatOutra" placeholder="Ou digite uma nova categoria" style="margin-top:8px; display:none;">

    <div class="actions">
      <button class="btn ghost" onclick="fecharModal()">Cancelar</button>
      <button class="btn primary" onclick="salvarFrase()">Salvar</button>
    </div>
  </div>
</div>

<script>
const CATS = [
  {id:'motivacional', label:'Motivacional', color:'var(--tag-motivacional)'},
  {id:'signos', label:'Signos', color:'var(--tag-signos)'},
  {id:'fe', label:'Fé', color:'var(--tag-fe)'},
  {id:'futebol', label:'Futebol', color:'var(--tag-futebol)'},
];
const COLOR_MAP = {motivacional:'#b5652f', signos:'#3d4a7a', fe:'#3e6b5c', futebol:'#1e7a44'};

let dados = JSON.parse(localStorage.getItem('frases-claudio') || '[]');
let filtroAtivo = 'todas';
let catSelecionada = null;

function salvarStorage(){
  localStorage.setItem('frases-claudio', JSON.stringify(dados));
}

function catInfo(id){
  const found = CATS.find(c => c.id === id);
  if(found) return found;
  return {id, label:id.charAt(0).toUpperCase()+id.slice(1), color:'var(--tag-outro)'};
}

function tiltFor(i){
  const seq=[-1.2,0.8,-0.6,1.3,-1.5,0.5];
  return seq[i % seq.length];
}

function renderFiltros(){
  const cont = document.getElementById('filters');
  const categoriasUsadas = [...new Set(dados.map(d=>d.categoria))];
  const todas = ['todas', ...CATS.map(c=>c.id), ...categoriasUsadas.filter(c=>!CATS.find(x=>x.id===c))];
  const unicas = [...new Set(todas)];
  cont.innerHTML = unicas.map(id=>{
    const label = id==='todas' ? 'Todas' : catInfo(id).label;
    const active = id===filtroAtivo ? 'active' : '';
    return `<button class="chip ${active}" onclick="filtrar('${id}')">${label}</button>`;
  }).join('');
}

function filtrar(id){
  filtroAtivo = id;
  renderFiltros();
  renderLista();
}

function renderLista(){
  const cont = document.getElementById('lista');
  let itens = dados;
  if(filtroAtivo !== 'todas') itens = itens.filter(d=>d.categoria===filtroAtivo);
  itens = [...itens].sort((a,b)=> b.data - a.data);

  if(itens.length === 0){
    cont.innerHTML = `<div class="empty"><span class="big">Ainda não tem nada aqui</span>Toque no + para colar sua primeira frase.</div>`;
    return;
  }

  cont.innerHTML = itens.map((item, i)=>{
    const info = catInfo(item.categoria);
    const dataFmt = new Date(item.data).toLocaleDateString('pt-BR', {day:'2-digit', month:'2-digit', year:'2-digit'});
    return `
      <div class="card" style="--tilt:${tiltFor(i)}deg">
        <div class="pin" style="background:${info.color}"></div>
        <span class="tag" style="background:${info.color}">${info.label}</span>
        <p class="frase">"${item.texto}"</p>
        <div class="meta">
          <span>${dataFmt}</span>
          <button class="del" onclick="excluir(${item.id})">excluir</button>
        </div>
      </div>`;
  }).join('');
}

function excluir(id){
  dados = dados.filter(d => d.id !== id);
  salvarStorage();
  renderFiltros();
  renderLista();
}

function renderCatRow(){
  const cont = document.getElementById('catrow');
  cont.innerHTML = CATS.map(c=>{
    return `<button class="catbtn" data-cat="${c.id}" onclick="selecionarCat('${c.id}')">${c.label}</button>`;
  }).join('') + `<button class="catbtn" data-cat="outra" onclick="selecionarCat('outra')">Outra...</button>`;
}

function selecionarCat(id){
  catSelecionada = id;
  document.querySelectorAll('.catbtn').forEach(b=>{
    b.classList.toggle('active', b.dataset.cat === id);
  });
  document.getElementById('inputCatOutra').style.display = id === 'outra' ? 'block' : 'none';
}

function abrirModal(){
  document.getElementById('overlay').classList.add('show');
  document.getElementById('inputFrase').value = '';
  document.getElementById('inputCatOutra').value = '';
  document.getElementById('inputCatOutra').style.display = 'none';
  catSelecionada = null;
  document.querySelectorAll('.catbtn').forEach(b=>b.classList.remove('active'));
}
function fecharModal(){
  document.getElementById('overlay').classList.remove('show');
}

function salvarFrase(){
  const texto = document.getElementById('inputFrase').value.trim();
  if(!texto){ alert('Escreva ou cole a frase primeiro.'); return; }

  let categoria = catSelecionada;
  if(categoria === 'outra'){
    const outra = document.getElementById('inputCatOutra').value.trim();
    if(!outra){ alert('Digite o nome da categoria.'); return; }
    categoria = outra.toLowerCase().replace(/\s+/g,'-');
  }
  if(!categoria){ alert('Escolha uma categoria.'); return; }

  dados.push({
    id: Date.now(),
    texto,
    categoria,
    data: Date.now()
  });
  salvarStorage();
  fecharModal();
  renderFiltros();
  renderLista();
}

async function colarDaAreaTransferencia(){
  try{
    const texto = await navigator.clipboard.readText();
    if(texto){
      document.getElementById('inputFrase').value = texto.trim();
    } else {
      alert('Área de transferência vazia.');
    }
  }catch(e){
    alert('Não consegui acessar a área de transferência. Cole manualmente (segure e escolha "Colar").');
  }
}

function receberFraseCompartilhada(){
  const params = new URLSearchParams(window.location.search);
  const texto = params.get('text') || params.get('title') || params.get('url');
  if(texto){
    abrirModal();
    document.getElementById('inputFrase').value = texto.trim();
    // limpa a URL pra não reabrir de novo se recarregar
    window.history.replaceState({}, '', window.location.pathname);
  }
}

document.getElementById('overlay').addEventListener('click', (e)=>{
  if(e.target.id === 'overlay') fecharModal();
});

renderCatRow();
renderFiltros();
renderLista();
receberFraseCompartilhada();
</script>
</body>
</html>
